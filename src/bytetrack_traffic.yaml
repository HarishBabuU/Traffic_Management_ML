# ByteTrack tracker for the traffic pipeline.
# Copy of Ultralytics default bytetrack.yaml with two tuned values:
#   new_track_thresh : 0.25 -> 0.35  (don't spawn new tracks on weak detections)
#   track_low_thresh  : 0.10 -> 0.20  (stricter recovery of lost tracks)
# All other settings are the Ultralytics defaults.
# Docs: https://docs.ultralytics.com/modes/track

tracker_type: bytetrack
track_high_thresh: 0.25
track_low_thresh: 0.20
new_track_thresh: 0.35
track_buffer: 30
match_thresh: 0.8
fuse_score: True